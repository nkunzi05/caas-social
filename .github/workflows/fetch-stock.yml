name: Fetch stock photos
# Downloads free Unsplash photos listed in stock/requests.txt into stock/.
# Line format:  <path under stock/>.jpg <images.unsplash.com URL or photo id> [unsplash page URL]
on:
  push:
    branches: [main]
    paths: [stock/requests.txt, .github/workflows/fetch-stock.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download missing photos
        run: |
          set -u
          failed=0
          while read -r path id credit; do
            [ -z "${path:-}" ] && continue
            case "$path" in \#*) continue;; esac
            out="stock/$path"
            [ -s "$out" ] && continue
            mkdir -p "$(dirname "$out")"
            echo "Fetching $id -> $out"
            # $id is either a direct https://images.unsplash.com/photo-... URL or an Unsplash photo id
            if [ "${id#https://}" != "$id" ]; then img="${id%%\?*}"; else
              page=$(curl -fsSL -m 60 -A "Mozilla/5.0" "https://unsplash.com/photos/$id" || true)
              img=$(printf '%s' "$page" | grep -oE 'https://images\.unsplash\.com/photo-[A-Za-z0-9_-]+' | head -1)
            fi
            if [ -z "$img" ]; then echo "FAILED (no image url) $id"; failed=1; continue; fi
            if curl -fsSL -m 60 "$img?w=1400&q=80&fm=jpg&fit=max" -o "$out"; then
              echo "$path | $img | ${credit:-Unsplash License}" >> stock/CREDITS.txt
            else
              echo "FAILED (download) $img"; rm -f "$out"; failed=1
            fi
          done < stock/requests.txt
          echo "failed=$failed" >> "$GITHUB_ENV"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock
          git diff --cached --quiet && exit 0
          git commit -m "Add stock photos"
          git push
      - name: Report failures
        if: env.failed == '1'
        run: exit 1
